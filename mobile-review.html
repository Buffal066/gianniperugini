<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gianni Perugini — Mobile Design Review</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111; color: #f4f4f4; }
    .review-shell {
      display: grid;
      grid-template-columns: minmax(220px, 340px) auto;
      gap: 48px;
      align-items: start;
      justify-content: center;
      padding: 32px;
    }
    .instructions {
      position: sticky;
      top: 32px;
      padding: 24px;
      border: 1px solid #343434;
      background: #181818;
    }
    .eyebrow { margin: 0 0 12px; color: #e33434; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-family: Georgia, serif; font-size: 30px; font-weight: 400; }
    p { margin: 0 0 16px; color: #c9c9c9; font-size: 15px; line-height: 1.6; }
    .size { display: inline-block; padding: 7px 10px; border: 1px solid #555; color: #fff; font-size: 12px; letter-spacing: .08em; }
    .phone {
      width: 414px;
      padding: 12px;
      border: 1px solid #454545;
      border-radius: 28px;
      background: #050505;
      box-shadow: 0 24px 70px rgba(0,0,0,.6);
    }
    .speaker { width: 72px; height: 5px; margin: 3px auto 10px; border-radius: 999px; background: #363636; }
    iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 17px; background: #000; }
    @media (max-width: 850px) {
      .review-shell { grid-template-columns: 1fr; justify-items: center; padding: 20px; }
      .instructions { position: static; max-width: 414px; }
    }
  </style>
</head>
<body>
  <main class="review-shell">
    <aside class="instructions">
      <p class="eyebrow">Design review</p>
      <h1>Mobile website preview</h1>
      <p>Scroll inside the phone and attach comments to the areas you want changed. This temporary preview is not part of the published website.</p>
      <span class="size">390 × 844 viewport</span>
    </aside>
    <section class="phone" aria-label="Mobile preview">
      <div class="speaker" aria-hidden="true"></div>
      <iframe title="Gianni Perugini Digital Art Store mobile preview" src="archive.html?review=mobile-frame#composites"></iframe>
    </section>
  </main>
</body>
</html>

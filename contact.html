        <section class="contact">
            <div class="container">
                <h1 class="section-title">Get in Touch</h1>
                <p class="section-subtitle">Interested in working together? Let's connect.</p>
                <div class="contact-content">
                    <div class="contact-info">
                        <div class="contact-details">
                            <div class="contact-item">
                                <span class="contact-label">Email</span>
                                <a class="contact-value" href="mailto:contact@gianniperugini.com">contact@gianniperugini.com</a>
                            </div>
                        </div>
                    </div>
                    <form class="contact-form" id="contact-form" method="post">
                        <input type="hidden" name="_subject" value="New message from gianniperugini.com">
                        <input type="hidden" name="_captcha" value="false">
                        <div class="form-group"><label for="name">Your name</label><input type="text" id="name" name="name" placeholder="Your Name" required></div>
                        <div class="form-group"><label for="email">Your email</label><input type="email" id="email" name="email" placeholder="Your Email" required></div>
                        <div class="form-group"><label for="subject">Subject</label><input type="text" id="subject" name="subject" placeholder="Subject" required></div>
                        <div class="form-group"><label for="message">Tell me about your project</label><textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea></div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
